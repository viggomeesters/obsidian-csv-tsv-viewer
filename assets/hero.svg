<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">CSV TSV Viewer</title>
  <desc id="desc">A dark app-style hero showing a CSV table preview.</desc>
  <rect width="1400" height="420" fill="#17181c"/>
  <rect x="48" y="48" width="1304" height="324" rx="18" fill="#202126" stroke="#3b3d45"/>
  <rect x="48" y="48" width="1304" height="52" rx="18" fill="#26272d"/>
  <circle cx="82" cy="74" r="8" fill="#ff5f57"/>
  <circle cx="108" cy="74" r="8" fill="#ffbd2e"/>
  <circle cx="134" cy="74" r="8" fill="#28c840"/>
  <text x="80" y="166" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="750">CSV TSV Viewer</text>
  <text x="82" y="206" fill="#a7a7ad" font-family="Inter, Arial, sans-serif" font-size="20">Read-only tables for AI-generated CSV and TSV files</text>
  <g transform="translate(82 248)">
    <rect width="82" height="34" rx="8" fill="#3f3f46"/>
    <text x="23" y="23" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Table</text>
    <rect x="92" width="82" height="34" rx="8" fill="#27272a" stroke="#45454c"/>
    <text x="113" y="23" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Source</text>
    <rect x="186" width="112" height="34" rx="8" fill="#17251e" stroke="#28684a"/>
    <text x="208" y="23" fill="#62d88f" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Read-only</text>
  </g>
  <g transform="translate(704 116)">
    <rect width="576" height="236" rx="12" fill="#111827" stroke="#3b3d45"/>
    <rect x="24" y="22" width="528" height="38" rx="8" fill="#29313f"/>
    <text x="48" y="47" fill="#d7dce8" font-family="Menlo, Consolas, monospace" font-size="15">#</text>
    <text x="104" y="47" fill="#59c8ff" font-family="Menlo, Consolas, monospace" font-size="15">name</text>
    <text x="246" y="47" fill="#59c8ff" font-family="Menlo, Consolas, monospace" font-size="15">status</text>
    <text x="390" y="47" fill="#59c8ff" font-family="Menlo, Consolas, monospace" font-size="15">score</text>
    <g fill="#e6d85c" font-family="Menlo, Consolas, monospace" font-size="15">
      <text x="48" y="92">1</text><text x="104" y="92">alpha</text><text x="246" y="92">ready</text><text x="390" y="92">98</text>
      <text x="48" y="132">2</text><text x="104" y="132">beta</text><text x="246" y="132">review</text><text x="390" y="132">86</text>
      <text x="48" y="172">3</text><text x="104" y="172">gamma</text><text x="246" y="172">blocked</text><text x="390" y="172">71</text>
      <text x="48" y="212">4</text><text x="104" y="212">delta</text><text x="246" y="212">done</text><text x="390" y="212">100</text>
    </g>
    <g stroke="#29313f">
      <line x1="80" y1="22" x2="80" y2="218"/>
      <line x1="220" y1="22" x2="220" y2="218"/>
      <line x1="364" y1="22" x2="364" y2="218"/>
      <line x1="24" y1="74" x2="552" y2="74"/>
      <line x1="24" y1="114" x2="552" y2="114"/>
      <line x1="24" y1="154" x2="552" y2="154"/>
      <line x1="24" y1="194" x2="552" y2="194"/>
    </g>
  </g>
</svg>
